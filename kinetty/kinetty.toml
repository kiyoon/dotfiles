# Kinetty terminal, scene, and platform configuration.


[scene]
preset = "exaggerated"

[scene.presets]

[scene.presets.follow]
initial_state = "active"

[scene.presets.follow.states]

[scene.presets.follow.states.active]

[scene.presets.follow.states.active.camera]
zoom = 2.0
drift_px = 20
drift_speed = 2
shake_px = 0

[scene.presets.follow.states.active.sheet]
shape = "saddle"
curvature_deg = 5
ripple = 1
splash = 2.5

[scene.presets.follow.states.active.sheet.cursor_response]
weight = -1
tilt_limit_deg = 18

[scene.presets.follow.states.active.effects]
particles = "inherit"
combo = true

[scene.presets.exaggerated]
initial_state = "rest"

[scene.presets.exaggerated.states]

[scene.presets.exaggerated.states.rest]

[scene.presets.exaggerated.states.rest.sheet]
ripple = 0.25

[scene.presets.exaggerated.states.typing]

[scene.presets.exaggerated.states.typing.camera]
zoom = 2.0
drift_px = 20
drift_speed = 2
shake_px = 0

[scene.presets.exaggerated.states.typing.sheet]
shape = "saddle"
curvature_deg = 5
ripple = 1
splash = 2.5

[scene.presets.exaggerated.states.typing.sheet.cursor_response]
weight = -1
tilt_limit_deg = 18

[scene.presets.exaggerated.states.typing.effects]
particles = "inherit"
combo = true

[[scene.presets.exaggerated.transitions]]
from = "rest"
to = "typing"
on = "typing"
duration_seconds = 0.8

[[scene.presets.exaggerated.transitions]]
from = "typing"
to = "rest"
on = "idle"
after_seconds = 1.5
duration_seconds = 2.5

[scene.presets.comfy]
initial_state = "rest"

[scene.presets.comfy.states]

[scene.presets.comfy.states.rest]

[scene.presets.comfy.states.rest.sheet]
ripple = 0.25

[scene.presets.comfy.states.typing]

[scene.presets.comfy.states.typing.camera]
zoom = 1.3
drift_px = 4
drift_speed = 2
shake_px = 0

[scene.presets.comfy.states.typing.sheet]
shape = "saddle"
curvature_deg = 0.2
ripple = 0.125
splash = 0.25

[scene.presets.comfy.states.typing.sheet.cursor_response]
weight = -1
tilt_limit_deg = 4

[scene.presets.comfy.states.typing.effects]
particles = "inherit"
combo = true

[[scene.presets.comfy.transitions]]
from = "rest"
to = "typing"
on = "typing"
duration_seconds = 0.8

[[scene.presets.comfy.transitions]]
from = "typing"
to = "rest"
on = "idle"
after_seconds = 1.5
duration_seconds = 2.5

[renderer]
focus_only = true

[camera]
overscroll = 1.0

[lighting]
strength = 1.8
minimum = 0
maximum = 1.4
shadow_color = "#6f5fa8"

[blur]
strength = 0.5

[sheet]
ripple_falloff = 1.0
splash_speed = 900
splash_life = 1.1
edge_shadow = 0
corner_radius = 0
edge_margin = 1024
edge_width = 0
gloss = 0.5

[images]
lift = 0.08
tilt_scale = 1.5

[particles]

[particles.particles]
life_min = 0.9
life_max = 1.6

[terminal]
camera_particles = "sparks"
watcher = [
    "camera_watcher.py",
]
#: kitty config ported from ../wezterm/wezterm.lua

#: Font {{{

font_family = "JetBrainsMono Nerd Font Mono"
#: wezterm's 14.3 gives a 17.16px advance, which kitty ceils to an
#: 18px cell (wezterm floors to 17). 14.1 stays under the 17px
#: boundary so the grid matches wezterm's without modify_font tricks.
font_size = "14.1"

#: Nerd icons from the same font wezterm renders them with (the
#: non-Mono variant), at natural size. kitty rejects it as a text font
#: (no monospace trait) but accepts it for symbol_map; without this,
#: the icons come from the Mono text font above, squeezed small.
#: Exact Nerd Fonts v3.4.0 ranges (kitty FAQ), not the whole PUA:
#: symbol_map codepoints the font lacks render as tofu instead of
#: falling back (verified with U+F8FF ), so unclaimed gaps must stay
#: unmapped.

#: 진짜 emoji는 wezterm과 같은 폰트(Noto)로. kitty는 macOS 기본인 Apple Color
#: Emoji로 떨어지는데, wezterm은 내장 Noto Color Emoji를 쓴다.
#: brew install --cask font-noto-color-emoji (install-nerdfont.sh 참고)

#: 상태줄 기호(tmux dracula의 배터리 ♥ 등)는 emoji가 아니라 글자로.
#: 위 emoji 매핑보다 뒤에 와야 이긴다. 조건 두 가지:
#:  - nerd font에 실제로 있어야 한다 (없는 걸 매핑하면 fallback 없이 두부가 된다)
#:  - Emoji_Presentation=Yes인 것(⌚ ⌛ ⚡ 등)은 빼야 한다. wezterm은 그것들을
#:    컬러 emoji로 그리므로 매핑하면 오히려 wezterm과 달라진다.
#: U+2714(heavy check)와 U+2716(heavy X)은 첫 조건에 걸려 뺐다. cmap 구간
#: 안에는 들어 있지만 glyph 0(.notdef)으로 가서, 매핑해 두면 fallback 없이
#: 두부가 된다 -- starship error_symbol이 깨진 원인. 빼면 fallback이 Menlo에서
#: 글자 모양으로 찾아온다(Emoji_Presentation=No라 컬러 emoji로 가지 않는다).
symbol_map = [
    "U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 JetBrainsMono Nerd Font",
    "U+1f000-U+1faff,U+1f1e6-U+1f1ff Noto Color Emoji",
    "U+2022,U+2191,U+2193,U+2197,U+2198,U+23fb-U+23fe,U+25aa,U+25ab,U+2665,U+26a0,U+2713,U+2b58 JetBrainsMono Nerd Font",
]

#: wezterm needed underline_position = -4 to keep undercurl pretty.
undercurl_style = "thick-sparse"
#: If the underline still sits too close to the text, lower it
#: (positive px moves it down):
# modify_font underline_position 2px

#: }}}

#: Performance (wezterm: max_fps = 120) {{{

#: 8ms ~ 125fps (default 10 ~ 100fps)
repaint_delay = "8"

#: }}}

#: Window (wezterm: window_decorations = "RESIZE") {{{

#: Native titlebar kept (draggable); blended into the background in
#: kinetty.toml.
window_padding_width = "8"

#: wezterm: window_background_opacity / macos_window_background_blur
background_opacity = "0.85"
# background_blur 20

#: }}}

#: Cursor {{{

#: A trail that chases the cursor across big jumps. The number is a dwell
#: time in ms: only a cursor that has held its position for that long gets
#: trailed, which is what stops a redrawing TUI from smearing. 3 filters
#: almost nothing, so nearly every jump leaves a trail.
cursor_trail = "3"

#: Fastest and slowest fade in seconds: a short hop clears in 0.1s, a jump
#: across the screen takes up to 0.4s. These are kitty's own defaults, written
#: out to tune from -- lower both to make the trail terser.
cursor_trail_decay = "0.1 0.4"

#: The smallest jump that draws a trail, as cells moved: 2 columns, 2 rows. A
#: trail is skipped only when the move is under the threshold in both
#: dimensions, so this leaves a walk down a file one line at a time untrailed.
#: Dropping the second value to 1 trails that too, at the price of a trail on
#: every j and k. Same as kitty's single default of 2, split in two because
#: 0.48 takes the axes separately.
cursor_trail_start_threshold = "2 2"

#: color13, the palette's bright purple, so the trail reads as motion rather
#: than as a second cursor. Left at none it takes the cursor's own color, which
#: is kitty's #cccccc here since nothing sets `cursor`.
cursor_trail_color = "#c397d8"

#: }}}

#: Scrollback (wezterm: enable_scroll_bar, scrollback_lines) {{{

scrollback_lines = "30000"

#: Show the scrollbar whenever there is scrollback, like wezterm's
#: enable_scroll_bar.
scrollbar = "always"
#: wezterm's #392a48 thumb was invisible here, so this is drawn solid and
#: wider than kitty's dim defaults (0.5 opacity, 0.5 cells).
#:
#: The tab bar's active purple, dark enough to sit quietly down the edge of
#: every window all day. One color has to serve two things: shaders.c paints
#: the OSC 9;4 progress bar from scrollbar_handle_color, and kitty has no
#: separate option for it, nor for its opacity or width -- so the progress bar
#: is this dark too. It still reads, because its track no longer fights it;
#: see scrollbar_track_color below. Not darker than this: #392a48 is where
#: wezterm's thumb disappeared against the #282c34 background, and #3b3052 is
#: already the track color.
scrollbar_handle_color = "#5b5072"
scrollbar_handle_opacity = "1"
#: The track defaults to `foreground`, which is #ffffff here, and the progress
#: bar always draws its track at scrollbar_track_hover_opacity (0.1) -- white
#: at 10% over #282c34, the grey stripe that made the bar hard to read. A dark
#: purple at that opacity sinks into the background instead, leaving only the
#: filled part visible. The scrollbar's own track stays hidden either way:
#: scrollbar_track_opacity is 0 except while the pointer is over it.
scrollbar_track_color = "#3b3052"
scrollbar_width = "0.75"

#: Titles belong to the shell and apps (claude code, nvim, ...) like in
#: wezterm; kitty's shell integration would otherwise rewrite the title
#: to the cwd at every prompt.
shell_integration = "no-title"

#: Remote control over a socket only (never over the tty, so programs
#: running in a pane cannot drive kitty), for hammerspoon's IME and
#: prompt-insert helpers. The socket is /tmp/kitty-<pid of kitty>.
allow_remote_control = "socket-only"
listen_on = "unix:/tmp/kitty"

#: The Python watcher in kinetty.toml handles Nvim camera effects.

#: }}}

#: Tab bar (wezterm: colors.tab_bar) {{{

tab_bar_edge = "top"
#: wezterm always shows the tab bar.
tab_bar_min_tabs = "1"
#: Powerline caps instead of a separator glyph: kitty paints the separator
#: cell of `tab_bar_style separator` in inactive_tab_background, so between
#: two inactive tabs it is the same color as the tabs and no edge shows.
tab_bar_style = "powerline"
tab_powerline_style = "round"
#: Strip the "user@host:" prefix shells put in titles, like wezterm's
#: short-path tabs, and lead with the tab's position so the cmd+<n> binding
#: to reach it is readable off the tab bar. No padding spaces here:
#: powerline draws its own.
#:
#: {tab.progress_percent} sits between the two: it returns '' unless a window
#: in the tab is reporting OSC 9;4, so it takes no room when nothing is
#: running, and it brings its own trailing space and its own error, paused and
#: indeterminate forms. Reading it twice costs nothing -- a couple of attribute
#: lookups.
#:
#: {tab.children_mem_usage} is deliberately absent. On macOS kitty runs each
#: window's shell under setuid-root /usr/bin/login, measuring that pid raises
#: PermissionError, and the tree walk abandons the whole tab rather than
#: summing the readable children -- so the field renders "0 B" and nothing
#: else. Only forward_stdio changes that, and it drops the login wrapper along
#: with getlogin() and the utmp record.
#:
#: A path is cut from the front -- "~/project/dear…" names no directory,
#: "…ject/deardent" does -- and every other title keeps kitty's own cut from
#: the back, which is the end an agent title can spare: its spinner and its
#: first words are at the head. max_title_length is the whole tab's cell
#: budget; powerline spends 2 of those on its padding and separator,
#: "{index}: " spends len(str(index)) + 2, and the progress spends its own
#: width, leaving the title the rest. Take one cell more and kitty trims the
#: overflow with an ellipsis of its own, so the title comes out cut at both
#: ends. Dropping one character per cell of overflow never leaves too many: no
#: character is narrower than one cell, so a CJK path just keeps fewer
#: characters than would have fit.
tab_title_template = "\"{index}: {tab.progress_percent}{(lambda t, n: t if t[:1] not in ('~', '/') or wcswidth(t) <= n else '…' + t[wcswidth(t) - n + 1:])(title.split(':', 1)[-1] if '@' in title.split(':', 1)[0] else title, max_title_length - len(str(index)) - 4 - wcswidth(tab.progress_percent))}\""
#: wezterm has a + button to create new tabs.
tab_bar_show_new_tab_button = "yes"

#: A cap only shows where two colors differ, and wezterm's three tab colors
#: sit 1.12:1 apart. These walk the same +0x10 ramp its palette does
#: (#3b3052 is its inactive_tab_hover), two steps per tab state instead of
#: one. Keep inactive_tab_background well clear of tab_bar_background: for
#: the soft cap between two inactive tabs kitty picks whichever of the strip
#: and the title color scores lower on its own contrast metric, and that
#: metric is a plain luminance ratio, so a near-black strip always wins it
#: while being invisible on the tab. That is how #1b1032 lost its edges.
tab_bar_background = "#0b0022"
#: Fill the fractional cell remainder at a translucent tab-bar edge.
tab_bar_margin_color = "#0b0022"
active_tab_background = "#5b5072"
active_tab_foreground = "#c0c0c0"
active_tab_font_style = "normal"
inactive_tab_background = "#3b3052"
#: Keeps the ~4.6:1 title contrast #808080 had on the darker tab.
inactive_tab_foreground = "#a0a0a0"

#: Not portable: wezterm's inactive_tab_hover / new_tab button colors.

#: }}}

#: Colors (setting copied from Ghostty 1.0, same as wezterm) {{{

background = "#282c34"
foreground = "#ffffff"

#: wezterm's selection purple (its built-in default, queried over
#: OSC 17); `none` keeps each cell's own text color when selected,
#: instead of kitty forcing black on lemon chiffon.
selection_background = "#7f6699"
selection_foreground = "none"

#: See https://www.ditig.com/publications/256-colors-cheat-sheet
#: in the range from 0 to 15
color0 = "#1d1f21"
color1 = "#cc6666"
color2 = "#b5bd68"
color3 = "#f0c674"
color4 = "#81a2be"
color5 = "#b294bb"
color6 = "#8abeb7"
color7 = "#c5c8c6"

color8 = "#666666"
color9 = "#d54e53"
color10 = "#b9ca4a"
color11 = "#e7c547"
color12 = "#7aa6da"
color13 = "#c397d8"
color14 = "#70c0b1"
color15 = "#eaeaea"

#: Panes = kitty windows in the splits layout.
enabled_layouts = "splits"

[platform]

[platform.macos]

[platform.macos.terminal]
macos_font_backend = "freetype"
#: macOS-only settings (wezterm: target_triple == "aarch64-apple-darwin")

#: Left Option acts as Alt so e.g. Alt+Enter reaches neovim
#: (python-import.nvim); right Option keeps composing characters.
#: Matches wezterm's default Option handling.
macos_option_as_alt = "left"

#: Draggable native titlebar blended into the terminal background,
#: no title text in it (tabs carry the info).
macos_titlebar_color = "background"
macos_show_window_title_in = "none"

#: kitty's macOS default (gamma 1.7, contrast 30) renders text bolder
#: than wezterm; gamma 1.0 is the neutral curve wezterm-like rasterizers
#: use. Keep the contrast at kitty's macOS default though: on a dark theme
#: gamma barely does anything ("light text on dark backgrounds is affected
#: very little") and the contrast term is what carries glyph weight --
#: 1.0 0 is the docs' starting point for tuning, and left there text goes
#: washed out. Raise/lower the second number to taste (0-100).
text_composition_strategy = "1.7 30"

#: Scene menus and font backend are configured in kinetty.toml.

#: kitty launched from the Dock inherits launchd's minimal PATH, so every
#: kitten it spawns misses homebrew: a choose-files video preview fails with
#: `exec: "ffprobe": executable file not found in $PATH`. Writing the PATH out
#: in full is the only form that holds. `${PATH}` prepends to the value it
#: already set, so each config reload grows it by another copy, and
#: `read_from_shell=PATH` is resolved only in setup_environment() at startup,
#: so a reload drops back to the minimal PATH and leaves a literal
#: read_from_shell variable in every child. Keep kitty's own bundle directory
#: in the list: toggle-tab-bar-edge.sh calls `kitten` by name.
env = "PATH=/opt/homebrew/bin:/opt/homebrew/sbin:/Applications/kitty.app/Contents/MacOS:/usr/bin:/bin:/usr/sbin:/sbin"

[platform.macos.bindings]
menus = [
    "global \"View::Change preset to comfy\" toggle_scene_preset comfy exaggerated",
    "global \"View::Camera: Follow\" set_scene_preset follow",
    "global \"View::Camera: Off\" set_scene_preset off",
    "global \"View::Toggle Sheet Tilt\" toggle_sheet_tilt",
    "global \"View::Toggle Typing Shake\" toggle_camera_shake",
    "global \"View::Toggle Typing Particles\" toggle_typing_particles",
    "global \"View::Toggle Typing Splash\" toggle_typing_splash",
    "global \"View::Toggle Idle Ripple\" toggle_idle_ripple",
    "global \"View::Toggle Typing Ripple\" toggle_typing_ripple",
    "global \"View::Effects::Weather::Off\"  set_weather none",
    "global \"View::Effects::Weather::Rain\" set_weather rain",
    "global \"View::Effects::Weather::Snow\" set_weather snow",
    "global \"View::Effects::Weather::Snow 2D\" set_weather snow-2d",
    "global \"View::Effects::Typing Particles::Off\"       set_typing_particles none",
    "global \"View::Effects::Typing Particles::Particles\" set_typing_particles particles",
    "global \"View::Effects::Typing Particles::Sparks\"    set_typing_particles sparks",
    "global \"View::Camera Zoom In (+50%)\" set_camera_zoom +0.5",
    "global \"View::Camera Zoom Out (-50%)\" set_camera_zoom -0.5",
    "global \"View::Camera Zoom::150%\" set_camera_zoom 1.5",
    "global \"View::Camera Zoom::200%\" set_camera_zoom 2.0",
    "global \"View::Camera Zoom::300%\" set_camera_zoom 3.0",
    "global \"View::Toggle Vertical Tabs\" remote_control_script toggle-tab-bar-edge.sh",
    "global \"View::Sidebar: Small\"  remote_control load-config -o tab_title_max_length=12 -o tab_bar_edge=left",
    "global \"View::Sidebar: Medium\" remote_control load-config -o tab_title_max_length=20 -o tab_bar_edge=left",
    "global \"View::Sidebar: Large\"  remote_control load-config -o tab_title_max_length=32 -o tab_bar_edge=left",
]
keys = [
    "ctrl+shift+equal no_op",
    "ctrl+shift+plus no_op",
    "ctrl+shift+kp_add no_op",
    "ctrl+shift+minus no_op",
    "ctrl+shift+kp_subtract no_op",
]

[plugins]
modules = [
    "/Users/kiyoon/project/wezterm-gureum/kitty/powermode/plugins/themes.py",
    "/Users/kiyoon/project/wezterm-gureum/kitty/powermode/plugins/games.py",
]

[bindings]
keys = [
    "cmd+shift+r load_config_file",
    "cmd+shift+f2 previous_tab",
    "cmd+shift+f3 previous_tab",
    "cmd+shift+f6 next_tab",
    "ctrl+shift+left move_tab_backward",
    "ctrl+shift+right move_tab_forward",
    "cmd+shift+b remote_control_script toggle-tab-bar-edge.sh",
    "cmd+1 goto_tab 1",
    "cmd+2 goto_tab 2",
    "cmd+3 goto_tab 3",
    "cmd+4 goto_tab 4",
    "cmd+5 goto_tab 5",
    "cmd+6 goto_tab 6",
    "cmd+7 goto_tab 7",
    "cmd+8 goto_tab 8",
    "cmd+9 goto_tab 9",
    "cmd+shift+d detach_window",
    "cmd+shift+c detach_window new-tab",
    "ctrl+alt+shift+backslash launch --location=vsplit --cwd=current",
    "ctrl+alt+shift+minus launch --location=hsplit --cwd=current",
    "shift+up scroll_to_prompt -1",
    "shift+down scroll_to_prompt 1",
    "cmd+shift+e kitten hints --customize-processing hyperlinks.py",
    "cmd+ctrl+shift+space discard_event",
]
