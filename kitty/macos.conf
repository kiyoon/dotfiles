#: macOS-only settings (wezterm: target_triple == "aarch64-apple-darwin")

#: Left Option acts as Alt so e.g. Alt+Enter reaches neovim
#: (python-import.nvim); right Option keeps composing characters.
#: Matches wezterm's default Option handling.
macos_option_as_alt left

#: Draggable native titlebar blended into the terminal background,
#: no title text in it (tabs carry the info).
macos_titlebar_color background
macos_show_window_title_in none

#: kitty's macOS default (gamma 1.7, contrast 30) renders text bolder
#: than wezterm; gamma 1.0 is the neutral curve wezterm-like rasterizers
#: use. Keep the contrast at kitty's macOS default though: on a dark theme
#: gamma barely does anything ("light text on dark backgrounds is affected
#: very little") and the contrast term is what carries glyph weight --
#: 1.0 0 is the docs' starting point for tuning, and left there text goes
#: washed out. Raise/lower the second number to taste (0-100).
text_composition_strategy 1.7 30
#: Disable ctrl+shift +/- zooming
#: in favour of using cmd + = and cmd + -
map ctrl+shift+equal no_op
map ctrl+shift+plus no_op
map ctrl+shift+kp_add no_op
map ctrl+shift+minus no_op
map ctrl+shift+kp_subtract no_op

#: A clickable toggle for the vertical tab bar. kitty draws no buttons in the
#: native titlebar and exposes no API to add one, and a click anywhere in the
#: tab bar that is not a tab opens a new tab, so the global menubar is where a
#: mouse can reach this. Keyboard equivalent: cmd+shift+b.
menu_map global "View::Toggle Vertical Tabs" remote_control_script toggle-tab-bar-edge.sh

#: Sidebar width presets. tab_title_max_length is the only width control kitty
#: has for a vertical tab bar: the boundary cannot be dragged, because kitty
#: marks no border zone at the tab bar edge, and it drops every mouse event
#: that lands on the bar but misses a tab. The numbers are title cells, which
#: here give sidebars of 20, 28 and 35 columns; 20 cells is kitty's own default
#: width. Each preset sets the edge as well, so picking a size while the tab
#: bar is horizontal switches to the sidebar in one click.
menu_map global "View::Sidebar: Small"  remote_control load-config -o tab_title_max_length=12 -o tab_bar_edge=left
menu_map global "View::Sidebar: Medium" remote_control load-config -o tab_title_max_length=20 -o tab_bar_edge=left
menu_map global "View::Sidebar: Large"  remote_control load-config -o tab_title_max_length=32 -o tab_bar_edge=left

#: The camera (the kiyoon/kitty power-mode fork) from the menu bar, for remote
#: desktop sessions where chords and trackpad gestures are awkward. The first
#: item's live title flips between comfy (1.3x, calmer water) and exaggerated
#: (2x, full movement); both keep the same tilt and particles. Follow is a
#: steady zoom
#: trailing the cursor, and Off turns the camera off in every window. A bare
#: zoom factor eases the camera to that magnification (1.0 turns it off); +/-
#: adjusts the current zoom. On a stock kitty build these entries still show
#: but clicking them only logs an unknown-action error.
menu_map global "View::Change preset to comfy" toggle_camera_mode comfy exaggerated
menu_map global "View::Camera: Follow" set_camera follow
menu_map global "View::Camera: Off" set_camera off
menu_map global "View::Toggle Camera Tilt" toggle_camera_tilt
menu_map global "View::Toggle Typing Shake" toggle_camera_shake
menu_map global "View::Toggle Typing Particles" toggle_typing_particles
menu_map global "View::Toggle Typing Splash" toggle_typing_splash
menu_map global "View::Toggle Idle Ripple" toggle_idle_ripple
menu_map global "View::Toggle Typing Ripple" toggle_typing_ripple

#: Scene effects, as a nested Effects menu with a checkmark on the live choice.
#: set_weather and set_typing_particles are the fork's own actions: each entry
#: switches at once, in every window, without a config reload.
menu_map global "View::Effects::Weather::Off"  set_weather none
menu_map global "View::Effects::Weather::Rain" set_weather rain
menu_map global "View::Effects::Weather::Snow" set_weather snow
menu_map global "View::Effects::Weather::Snow 2D" set_weather snow-2d
menu_map global "View::Effects::Typing Particles::Off"       set_typing_particles none
menu_map global "View::Effects::Typing Particles::Particles" set_typing_particles particles
menu_map global "View::Effects::Typing Particles::Sparks"    set_typing_particles sparks
menu_map global "View::Camera Zoom In (+50%)" set_camera_zoom +0.5
menu_map global "View::Camera Zoom Out (-50%)" set_camera_zoom -0.5
menu_map global "View::Camera Zoom::150%" set_camera_zoom 1.5
menu_map global "View::Camera Zoom::200%" set_camera_zoom 2.0
menu_map global "View::Camera Zoom::300%" set_camera_zoom 3.0

#: kitty launched from the Dock inherits launchd's minimal PATH, so every
#: kitten it spawns misses homebrew: a choose-files video preview fails with
#: `exec: "ffprobe": executable file not found in $PATH`. Writing the PATH out
#: in full is the only form that holds. `${PATH}` prepends to the value it
#: already set, so each config reload grows it by another copy, and
#: `read_from_shell=PATH` is resolved only in setup_environment() at startup,
#: so a reload drops back to the minimal PATH and leaves a literal
#: read_from_shell variable in every child. Keep kitty's own bundle directory
#: in the list: toggle-tab-bar-edge.sh calls `kitten` by name.
env PATH=/opt/homebrew/bin:/opt/homebrew/sbin:/Applications/kitty.app/Contents/MacOS:/usr/bin:/bin:/usr/sbin:/sbin

#: Render glyphs with FreeType + Cairo instead of CoreText (font selection
#: stays with CoreText). CoreText draws Noto Color Emoji through its OpenType
#: SVG table and re-parses the 19 MB table for every font size, so zooming
#: with a Noto emoji on screen stalled ~1.5 s per step; FreeType renders the
#: same file's COLRv1 glyphs in ~1 ms. This is the kiyoon/kitty fork's default
#: (kept explicit here); a build made with --macos-coretext-only logs an
#: error and uses CoreText. See docs/mac-font-backend.rst in the fork.
macos_font_backend freetype
